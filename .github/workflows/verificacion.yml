name: Integración Continua - Plataforma de Sostenibilidad

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion-calidad:
    name: Verificación y Pruebas Automatizadas
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CLAVE_SECRETA_JWT: clave_ficticia_aislada_para_pruebas_ci_2026

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v7

      - name: Configurar entorno Node.js 20 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Medir cobertura de modulos evaluados
        run: npm run probar:cobertura

      - name: Compilar cliente web para produccion
        run: npm --prefix cliente run construir
