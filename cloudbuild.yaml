steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/plataforma-sostenibilidad-api', './servidor']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/plataforma-sostenibilidad-api']
  - name: 'gcr.io/google-cloud-sdk/slim'
    entrypoint: gcloud
    args: ['run', 'deploy', 'plataforma-sostenibilidad-api', '--image=gcr.io/$PROJECT_ID/plataforma-sostenibilidad-api', '--region=us-east1']
images:
  - 'gcr.io/$PROJECT_ID/plataforma-sostenibilidad-api'
options:
  logging: CLOUD_LOGGING_ONLY
